version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: uniresolve_postgres_dev
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: Sundaysummer
      POSTGRES_DB: uniresolve_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d uniresolve_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: